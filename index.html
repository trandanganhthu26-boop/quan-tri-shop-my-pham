<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản trị shop mỹ phẩm online</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f8f6;--card:#fff;--ink:#14261d;--mute:#6a7d72;--line:#e2ebe5;--acc:#0f7a4d;--acc2:#e1f3ea;--ok:#13804f;--wn:#b7791f;--bad:#c62f46;--bb:#fde8ec;--wb:#fdf1d8;--on:#fff;--sh:0 1px 2px rgba(16,40,28,.05),0 4px 14px rgba(16,40,28,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1814;--card:#16241d;--ink:#e6f1ea;--mute:#9db3a5;--line:#2a3f33;--acc:#4fc08a;--acc2:#21402f;--ok:#5cc08f;--wn:#e0b050;--bad:#ef7b73;--bb:#3a1d24;--wb:#3a2f16;--on:#0b1f15}}
:root[data-theme=dark]{--bg:#0e1814;--card:#16241d;--ink:#e6f1ea;--mute:#9db3a5;--line:#2a3f33;--acc:#4fc08a;--acc2:#21402f;--ok:#5cc08f;--wn:#e0b050;--bad:#ef7b73;--bb:#3a1d24;--wb:#3a2f16;--on:#0b1f15}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:14px/1.5 'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100%}
#hd{background:linear-gradient(90deg,#0c5a39,#0a4d32);color:#fff;display:flex;align-items:center;gap:18px;padding:14px 32px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}.bi{width:46px;height:46px;border-radius:12px;background:#1fc58a;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.brand b{font-size:20px;white-space:nowrap}.brand em{font-style:normal;font-size:10.5px;background:rgba(255,255,255,.18);padding:1px 7px;border-radius:6px;margin-left:8px;vertical-align:middle}.brand small{display:block;font-size:12px;opacity:.8}
.srch{flex:1;max-width:620px;position:relative;margin:0 auto}.srch input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:12px;padding:11px 54px 11px 42px}.srch input::placeholder{color:rgba(255,255,255,.7)}
.srch span{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.85}.srch kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);border-radius:6px;padding:0 8px;font:12px/20px inherit}
.chip{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:6px 12px;font-size:12px;line-height:1.25;white-space:nowrap}.chip b{display:block;font-size:14px}
.user{display:flex;gap:10px;align-items:center;white-space:nowrap;font-size:12px}.user b{display:block;font-size:14px}.av{width:40px;height:40px;border-radius:50%;background:#1fc58a;display:grid;place-items:center;font-weight:700;color:#06301d}
#gn{background:#08452c;display:flex;gap:6px;padding:8px 32px;overflow-x:auto}
#gn button{background:none;color:#cfe9db;border-radius:10px;padding:8px 16px;white-space:nowrap}#gn button.on{background:#0f6b45;color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
#sn{display:flex;gap:6px;padding:10px 32px;align-items:center;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
#sn button{background:none;color:var(--ink);border-radius:99px;padding:6px 16px;white-space:nowrap}#sn button.on{background:var(--acc2);color:var(--acc);font-weight:500}#sn .sy{margin-left:auto;font-size:12.5px;color:var(--mute);white-space:nowrap;padding-left:16px}
main{flex:1;min-width:0;padding:28px 32px}
h3{margin:0 0 10px}.mute{color:var(--mute);font-size:12.5px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}.ph h2{margin:0;font-size:28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.ph h2 span{font-size:12.5px;font-weight:400;color:var(--mute);border:1px solid var(--line);background:var(--card);border-radius:8px;padding:1px 10px}.ph p{margin:4px 0 0;color:var(--mute)}.ph .ac{display:flex;gap:10px;flex-wrap:wrap}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.bar .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}.stats span,.stats em{color:var(--mute);font-size:13px;font-style:normal}.stats b{display:block;font-size:28px;line-height:1.3}.stats small{font-size:13px;color:var(--mute);font-weight:400}
.ci{display:flex;justify-content:space-between;align-items:center;gap:10px}.ci em{display:block;font-size:12.5px;font-weight:500}.ib{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 18px;margin-bottom:16px}.fl input,.fl select{width:auto;min-width:170px;border-radius:10px;padding:9px 12px}.fl .fi{flex:1;min-width:220px}
.tw{overflow-x:auto;padding:4px 10px}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}th{color:var(--mute);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}tbody tr:hover{background:var(--bg)}
button,input,select{font:inherit}button{background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:500}
button.g,button.o{background:var(--card);color:var(--ink);border:1px solid var(--line)}button.s{padding:3px 10px;font-size:12.5px}button.lk{background:none;border:0;color:var(--mute);margin-left:auto}
.ic{background:none;color:var(--mute);padding:4px 7px;font-size:15px}.ic:hover{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input,select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}input[type=checkbox]{width:auto;padding:0}
.tag,.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 11px;border-radius:99px;font-size:12.5px;background:var(--acc2);color:var(--ok);font-weight:500}.tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.bad{color:var(--bad);background:var(--bb)}.tag.wn{color:var(--wn);background:var(--wb)}
.pid{font:12px ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.cat{background:var(--acc2);color:var(--acc);border-radius:8px;padding:2px 10px;font-size:12.5px}
.nm{font-weight:700}.nm small{display:block;font-weight:400;color:var(--mute);font-size:12.5px}
.pb{height:5px;background:var(--line);border-radius:99px;width:90px;margin-top:4px}.pb i{display:block;height:100%;background:var(--ok);border-radius:99px}
.chart{display:flex;gap:10px;align-items:flex-end;height:140px}.chart div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--mute)}
.chart i{display:block;width:100%;background:var(--acc);border-radius:5px 5px 0 0;min-height:2px}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.hero{background:linear-gradient(120deg,#ffd6e3,#ffb3cc);border-radius:14px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px;color:#6b1236}.hero h2{margin:0 0 2px;font-size:24px}.hero button{background:#e0245e;color:#fff;border-radius:99px;padding:10px 22px}
.sc{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-bottom:14px}.sc button{background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px}.sc i{font-style:normal;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:20px;width:min(520px,94vw);max-height:92vh}dialog::backdrop{background:rgba(8,24,16,.5)}
.f{display:grid;gap:10px}.f label{display:grid;gap:3px;font-size:12.5px;color:var(--mute)}.act{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.ln{display:grid;grid-template-columns:1fr 80px;gap:8px}.tot{font-weight:700;text-align:right;margin:0}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#08452c;color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:99}
@media(max-width:900px){#hd{flex-wrap:wrap;padding:12px 16px}.chip,.user{display:none}.srch{order:3;max-width:none;flex-basis:100%}#gn,#sn{padding-left:12px;padding-right:12px}.g2{grid-template-columns:1fr}main{padding:16px}.ph h2{font-size:22px}}
</style>
</head>
<body>
<header id="hd"></header><nav id="gn"></nav><div id="sn"></div><main id="main"></main><dialog id="dlg"></dialog><div id="toast"></div>
<script>
/* ===== 1. LƯỢC ĐỒ — mô phỏng đúng 16 bảng trong file SQL Server (tên bảng, tên cột, khóa, ràng buộc CHECK/UNIQUE/FK) =====
 c: [tên cột, nhãn (* = NOT NULL), kiểu, mặc định]. Kiểu: t=chuỗi, n0/n1/n+=số nguyên (>=0 / >=1 / >0), n15=1..5, m+/m0=tiền (>0 / >=0),
 d=date, i=datetime, b=bit, f:Bảng=khóa ngoại, e:A,B=CHECK IN(...). pk=khóa tự tăng, key=khóa chính kép, uq=UNIQUE, chk=CHECK nhiều cột */
const T={
ThuongHieu:{n:'Thương hiệu',pk:'MaThuongHieu',uq:['TenThuongHieu'],c:[['TenThuongHieu','Tên thương hiệu*','t'],['XuatXu','Xuất xứ','t'],['MoTa','Mô tả','t']]},
DanhMuc:{n:'Danh mục',pk:'MaDanhMuc',uq:['TenDanhMuc'],c:[['TenDanhMuc','Tên danh mục*','t']]},
ChiNhanh:{n:'Chi nhánh',pk:'MaChiNhanh',c:[['TenChiNhanh','Tên chi nhánh*','t'],['DiaChi','Địa chỉ*','t'],['LoaiChiNhanh','Loại chi nhánh*','e:CuaHang,Kho']]},
DonViVanChuyen:{n:'Đơn vị vận chuyển',pk:'MaDVVC',uq:['TenDVVC'],c:[['TenDVVC','Tên ĐVVC*','t'],['SoDienThoai','Số điện thoại','t']]},
SanPham:{n:'Sản phẩm',pk:'MaSanPham',chk:r=>r.GiaKhuyenMai!=null&&r.GiaKhuyenMai>r.GiaBan&&'Giá khuyến mãi phải ≤ giá bán',c:[['TenSanPham','Tên sản phẩm*','t'],['MaThuongHieu','Thương hiệu*','f:ThuongHieu'],['MaDanhMuc','Danh mục*','f:DanhMuc'],['GiaBan','Giá bán*','m+'],['GiaKhuyenMai','Giá khuyến mãi','m+'],['DungTich','Dung tích','t'],['LoaiDaPhuHop','Loại da phù hợp','t'],['HSD','Hạn sử dụng','d'],['TrangThai','Trạng thái*','e:DangBan,An,NgungKinhDoanh']]},
KhachHang:{n:'Khách hàng',pk:'MaKhachHang',uq:['Email','SoDienThoai'],c:[['HoTen','Họ tên*','t'],['Email','Email','t'],['SoDienThoai','Số điện thoại*','t'],['DiaChi','Địa chỉ','t'],['DiemTichLuy','Điểm tích lũy*','n0',0]]},
NhanVien:{n:'Nhân viên',pk:'MaNhanVien',uq:['SoDienThoai'],c:[['HoTen','Họ tên*','t'],['ChucVu','Chức vụ','t'],['SoDienThoai','Số điện thoại','t'],['MaChiNhanh','Chi nhánh*','f:ChiNhanh']]},
TonKhoChiNhanh:{n:'Tồn kho chi nhánh',key:['MaChiNhanh','MaSanPham'],chk:r=>r.SoLuongGiuCho>r.SoLuong&&'Số lượng giữ chỗ phải ≤ số lượng tồn',c:[['MaChiNhanh','Chi nhánh*','f:ChiNhanh'],['MaSanPham','Sản phẩm*','f:SanPham'],['SoLuong','Số lượng tồn*','n0',0],['SoLuongGiuCho','Số lượng giữ chỗ*','n0',0]]},
MaGiamGia:{n:'Mã giảm giá',pk:'MaGiamGia',uq:['Code'],chk:r=>(r.LoaiGiam=='PhanTram'&&r.GiaTriGiam>100&&'Giảm theo % không được quá 100')||(r.NgayKetThuc<=r.NgayBatDau&&'Ngày kết thúc phải sau ngày bắt đầu'),c:[['Code','Mã code*','t'],['LoaiGiam','Loại giảm*','e:PhanTram,SoTien'],['GiaTriGiam','Giá trị giảm*','n+'],['GiaTriDonToiThieu','Đơn tối thiểu*','m0',0],['GioiHanSuDung','Giới hạn sử dụng*','n1',100],['NgayBatDau','Ngày bắt đầu*','i','now'],['NgayKetThuc','Ngày kết thúc*','i']]},
DonHang:{n:'Đơn hàng (bản ghi)',pk:'MaDonHang',l:r=>'#'+r.MaDonHang+' – '+L('KhachHang',r.MaKhachHang),c:[['MaKhachHang','Khách hàng*','f:KhachHang'],['MaNhanVien','Nhân viên','f:NhanVien'],['MaChiNhanh','Chi nhánh*','f:ChiNhanh'],['MaGiamGia','Mã giảm giá','f:MaGiamGia'],['NgayDat','Ngày đặt*','i','now'],['DiaChiGiao','Địa chỉ giao*','t'],['TrangThai','Trạng thái*','e:ChoXacNhan,DaXacNhan,DangGiao,DaGiao,DaHuy,DoiTra']]},
ChiTietDonHang:{n:'Chi tiết đơn hàng',key:['MaDonHang','MaSanPham'],c:[['MaDonHang','Đơn hàng*','f:DonHang'],['MaSanPham','Sản phẩm*','f:SanPham'],['SoLuong','Số lượng*','n1',1],['DonGia','Đơn giá*','m+']]},
ThanhToan:{n:'Thanh toán',pk:'MaThanhToan',c:[['MaDonHang','Đơn hàng*','f:DonHang'],['PhuongThuc','Phương thức*','e:COD,The,ViDienTu,ChuyenKhoan'],['SoTien','Số tiền*','m+'],['TrangThai','Trạng thái*','e:ChoThanhToan,DaThanhToan,ThatBai,DaHoanTien'],['NgayThanhToan','Ngày thanh toán','i']]},
VanDon:{n:'Vận đơn',pk:'MaVanDon',uq:['MaVanDonNgoai'],chk:r=>(r.NgayGiaoThucTe&&r.NgayGiaoThucTe<r.NgayGui&&'Ngày giao thực tế phải ≥ ngày gửi')||(r.NgayHenGiao&&r.NgayHenGiao<r.NgayGui&&'Ngày hẹn giao phải ≥ ngày gửi'),c:[['MaDonHang','Đơn hàng*','f:DonHang'],['MaDVVC','Đơn vị vận chuyển*','f:DonViVanChuyen'],['MaVanDonNgoai','Mã vận đơn ngoài*','t'],['LoaiGiao','Loại giao*','e:Thuong,Nhanh2H'],['NgayGui','Ngày gửi*','i','now'],['NgayHenGiao','Ngày hẹn giao','i'],['NgayGiaoThucTe','Ngày giao thực tế','i']]},
YeuCauDoiTra:{n:'Yêu cầu đổi trả',pk:'MaYeuCau',l:r=>'#'+r.MaYeuCau+' (đơn #'+r.MaDonHang+')',c:[['MaDonHang','Đơn hàng*','f:DonHang'],['NgayYeuCau','Ngày yêu cầu*','i','now'],['LyDo','Lý do*','t'],['TrangThai','Trạng thái*','e:ChoDuyet,DaDuyet,TuChoi,DaNhanHang,HoanTat']]},
ChiTietDoiTra:{n:'Chi tiết đổi trả',key:['MaYeuCau','MaSanPham'],c:[['MaYeuCau','Yêu cầu đổi trả*','f:YeuCauDoiTra'],['MaSanPham','Sản phẩm*','f:SanPham'],['SoLuong','Số lượng*','n1',1]]},
DanhGia:{n:'Đánh giá',pk:'MaDanhGia',key:['MaKhachHang','MaSanPham','MaDonHang'],c:[['MaKhachHang','Khách hàng*','f:KhachHang'],['MaSanPham','Sản phẩm*','f:SanPham'],['MaDonHang','Đơn hàng*','f:DonHang'],['SoSao','Số sao (1-5)*','n15',5],['NoiDung','Nội dung','t'],['NgayDanhGia','Ngày đánh giá*','i','now'],['DaDuyet','Đã duyệt','b',0]]}
};
const LB={DangBan:'Đang bán',An:'Ẩn',NgungKinhDoanh:'Ngừng kinh doanh',CuaHang:'Cửa hàng',Kho:'Kho',PhanTram:'Phần trăm',SoTien:'Số tiền',ChoXacNhan:'Chờ xác nhận',DaXacNhan:'Đã xác nhận',DangGiao:'Đang giao',DaGiao:'Đã giao',DaHuy:'Đã hủy',DoiTra:'Đổi trả',COD:'COD',The:'Thẻ',ViDienTu:'Ví điện tử',ChuyenKhoan:'Chuyển khoản',ChoThanhToan:'Chờ thanh toán',DaThanhToan:'Đã thanh toán',ThatBai:'Thất bại',DaHoanTien:'Đã hoàn tiền',Thuong:'Thường',Nhanh2H:'Nhanh 2H',ChoDuyet:'Chờ duyệt',DaDuyet:'Đã duyệt',TuChoi:'Từ chối',DaNhanHang:'Đã nhận hàng',HoanTat:'Hoàn tất'};
/* ===== 2. TIỆN ÍCH & LỚP DỮ LIỆU — khi gắn SQL: thay DB/add/tk bằng lệnh gọi API backend, các hàm giao diện giữ nguyên ===== */
const $=s=>document.querySelector(s),DB={};for(const k in T)DB[k]=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vnd=n=>new Intl.NumberFormat('vi-VN').format(Math.round(n))+' ₫';
const now=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const addD=(s,d)=>new Date(new Date(s+'Z').getTime()+d*864e5).toISOString().slice(0,16);
const tag=s=>`<span class="tag ${/^(DaGiao|DaThanhToan|HoanTat|DaDuyet|DangBan|CuaHang)$/.test(s)?'ok':/^(DaHuy|ThatBai|TuChoi|NgungKinhDoanh)$/.test(s)?'bad':'wn'}">${LB[s]||esc(s)}</span>`;
const L=(t,id)=>{const m=T[t],r=DB[t].find(x=>x[m.pk]==id);return r?(m.l?m.l(r):r[m.c[0][0]]):''};
const add=(t,o)=>{const m=T[t];if(m.pk)o[m.pk]=DB[t].reduce((a,r)=>Math.max(a,r[m.pk]),0)+1;DB[t].push(o);return o};
const tk=(c,p)=>DB.TonKhoChiNhanh.find(x=>x.MaChiNhanh==c&&x.MaSanPham==p);
const sub=id=>DB.ChiTietDonHang.filter(l=>l.MaDonHang==id).reduce((a,l)=>a+l.SoLuong*l.DonGia,0);
const disc=o=>{const g=DB.MaGiamGia.find(x=>x.MaGiamGia==o.MaGiamGia),s=sub(o.MaDonHang);return !g?0:g.LoaiGiam=='PhanTram'?s*g.GiaTriGiam/100:Math.min(g.GiaTriGiam,s)};
const tot=o=>sub(o.MaDonHang)-disc(o);
const tbl=(h,r)=>`<div class="card tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||'<tr><td class="mute">Không có dữ liệu.</td></tr>'}</tbody></table></div>`;
const rows=s=>s.trim().split('\n').map(l=>l.split('|'));

/* ===== 3. DỮ LIỆU MẪU — lấy từ file SQL (bảng nhỏ chép nguyên, đơn hàng/chi tiết/thanh toán/vận đơn/đổi trả/đánh giá sinh theo đúng công thức INSERT) ===== */
rows(`Innisfree|Hàn Quốc|Mỹ phẩm thiên nhiên từ đảo Jeju
La Roche-Posay|Pháp|Dược mỹ phẩm cho da nhạy cảm
Cocoon|Việt Nam|Mỹ phẩm thuần chay từ nguyên liệu Việt
The Ordinary|Canada|Hoạt chất nồng độ cao, giá hợp lý
Cerave|Mỹ|Phục hồi hàng rào bảo vệ da với ceramide
Laneige|Hàn Quốc|Chuyên cấp ẩm cho da
Some By Mi|Hàn Quốc|Chuyên trị da mụn

  return `<div class="hero"><div><h2>Chào mừng trở lại!</h2>Hôm nay có <b>${['ChoXacNhan','DaXacNhan','DangGiao'].reduce((a,k)=>a+(st[k]||0),0)}</b> đơn đang chờ xử lý.</div><button onclick="orderForm()">Tạo đơn mới</button></div><div class="sc">${sc.map(([k,e,l,c])=>`<button onclick="go('${k}')"><i style="background:${c}">${e}</i>${l}</button>`).join('')}</div><div class="stats"><div class="card"><span>Doanh thu (không tính đơn hủy)</span><b>${vnd(rev)}</b></div><div class="card"><span>Tổng số đơn</span><b>${DB.DonHang.length}</b></div><div class="card"><span>Đơn đang xử lý</span><b>${['ChoXacNhan','DaXacNhan','DangGiao'].reduce((a,k)=>a+(st[k]||0),0)}</b></div><div class="card"><span>Khách hàng</span><b>${DB.KhachHang.length}</b></div><div class="card"><span>Dòng tồn kho sắp hết (≤25)</span><b>${low.length}</b></div></div>
  <div class="g2"><div class="card"><h3>Doanh thu theo tháng</h3><div class="chart">${ks.map(k=>`<div title="${vnd(mo[k])}"><i style="height:${mo[k]/mx*100}%"></i>T${+k.slice(5)}</div>`).join('')}</div></div>
  <div class="card"><h3>Doanh thu theo thương hiệu</h3>${brandRev().map(([b,v])=>`<div class="row"><span>${esc(b)}</span><b>${vnd(v)}</b></div>`).join('')}</div></div>
  <div class="g2"><div class="card"><h3>Đơn hàng theo trạng thái</h3>${Object.keys(st).map(k=>`<div class="row">${tag(k)}<b>${st[k]}</b></div>`).join('')}</div>
  <div class="card"><h3>Cần nhập thêm (còn bán được ≤25)</h3>${low.slice(0,6).map(t=>`<div class="row"><span>${esc(L('SanPham',t.MaSanPham))} · ${esc(L('ChiNhanh',t.MaChiNhanh))}</span><span class="tag bad">${t.a}</span></div>`).join('')||'<span class="mute">Tồn kho đều ổn.</span>'}</div></div>`;
},
orders(){
  const rs=[...DB.DonHang].reverse().map(o=>{const id=o.MaDonHang,n=NX[o.TrangThai],p=DB.ThanhToan.find(x=>x.MaDonHang==id);
    return ['#'+id,o.NgayDat.replace('T',' '),esc(L('KhachHang',o.MaKhachHang)),esc(L('ChiNhanh',o.MaChiNhanh)),vnd(tot(o)),tag(o.TrangThai),p?tag(p.TrangThai):'—',
    `<button class="s g" onclick="detail(${id})">Chi tiết</button> `+(n?`<button class="s" onclick="step(${id},'${n[0]}')">${n[1]}</button> <button class="s g" onclick="step(${id},'DaHuy')">Hủy</button> `:'')+(o.TrangThai=='DaGiao'?`<button class="s g" onclick="ret(${id})">Đổi trả</button> `:'')+`<button class="s g" onclick="form('DonHang',${DB.DonHang.indexOf(o)})">Sửa</button>`]});
  return ph('Đơn hàng','Đơn mới giữ chỗ tồn kho; chuyển "Đã giao" mới trừ kho và ghi nhận thanh toán.','<button onclick="orderForm()">＋ Tạo đơn</button>','<span>'+DB.DonHang.length+' đơn</span>')+tbl(['Mã','Ngày đặt','Khách hàng','Chi nhánh','Thành tiền','Trạng thái','Thanh toán',''],rs);
},
qry(){const r=Q[S.qi][1]();return `${ph('Truy vấn SQL','Chạy lại 10 truy vấn trong file SQL của nhóm trên dữ liệu hiện có.','')}<div class="bar">${Q.map((q,i)=>`<button class="s ${i==S.qi?'':'g'}" onclick="S.qi=${i};render()">Q${i+1}</button>`).join('')}</div><p class="mute">${Q[S.qi][0]}</p>`+tbl(r.h,r.r)}
};
const NAV=[['Tổng quan',[['dash','Tổng quan']]],['Bán hàng',[['orders','Đơn hàng'],['ChiTietDonHang'],['ThanhToan'],['VanDon'],['YeuCauDoiTra'],['ChiTietDoiTra'],['DanhGia']]],['Sản phẩm',[['SanPham'],['ThuongHieu'],['DanhMuc'],['MaGiamGia']]],['Kho và nhân sự',[['TonKhoChiNhanh'],['ChiNhanh'],['NhanVien'],['DonViVanChuyen']]],['Khách hàng',[['KhachHang']]],['Báo cáo',[['qry','Truy vấn SQL']]]];
const go=k=>{view=k;S.q='';S.pg=0;S.f={};S.sel.clear();render()};
function render(){
  const gi=NAV.findIndex(([,it])=>it.some(x=>x[0]==view)),np=DB.DonHang.filter(o=>o.TrangThai=='ChoXacNhan').length;
  $('#hd').innerHTML=`<div class="brand"><div class="bi">🧴</div><div><b>Mỹ Phẩm Online<em>QUẢN TRỊ</em></b><small>Hệ thống quản trị bán hàng và tồn kho tập trung</small></div></div><div class="srch"><span>⌕</span><input id="gs" placeholder="Tìm theo tên mỹ phẩm, thương hiệu… (nhấn / để tìm)" onkeydown="if(event.key=='Enter'){view='SanPham';S.q=this.value;S.pg=0;S.f={};S.sel.clear();render()}"><kbd>/</kbd></div><div class="chip"><span>🛍️</span><div><b>${np} đơn</b>Chờ xác nhận</div></div><div class="chip"><span>👥</span><div><b>${DB.KhachHang.length}</b>Khách hàng</div></div><div class="user"><div class="av">QT</div><div><b>Quản trị viên</b>Shop mỹ phẩm</div></div>`;
  $('#gn').innerHTML=NAV.map(([g,it],k)=>`<button class="${k==gi?'on':''}" onclick="go('${it[0][0]}')">${k==gi?'● ':''}${g}</button>`).join('');
  $('#sn').innerHTML=NAV[gi][1].map(([k,l])=>`<button class="${k==view?'on':''}" onclick="go('${k}')">${l||T[k].n}</button>`).join('')+`<span class="sy">● Cập nhật lúc ${now().slice(11)}</span>`;
  if(T[view])listPage(view);
  else $('#main').innerHTML=VIEWS[view]();
}
const D={ThuongHieu:'Quản lý các thương hiệu mỹ phẩm và xuất xứ.',DanhMuc:'Phân nhóm sản phẩm để tìm kiếm và báo cáo.',ChiNhanh:'Các cửa hàng và kho của hệ thống.',DonViVanChuyen:'Đối tác giao hàng và số điện thoại liên hệ.',SanPham:'Danh sách sản phẩm, giá bán, giá khuyến mãi và trạng thái kinh doanh.',KhachHang:'Thông tin khách hàng và điểm tích lũy.',NhanVien:'Nhân viên theo từng chi nhánh.',TonKhoChiNhanh:'Theo dõi số lượng khả dụng, hàng đặt giữ trước và cảnh báo nhập hàng theo chi nhánh.',MaGiamGia:'Mã khuyến mãi, điều kiện áp dụng và thời hạn sử dụng.',ChiTietDonHang:'Các dòng sản phẩm trong từng đơn, đơn giá lưu tại thời điểm bán.',ThanhToan:'Phương thức và trạng thái thanh toán của từng đơn.',VanDon:'Vận đơn, đơn vị vận chuyển và thời gian giao hàng.',YeuCauDoiTra:'Yêu cầu đổi trả và tiến độ xử lý.',ChiTietDoiTra:'Sản phẩm và số lượng trong từng yêu cầu đổi trả.',DanhGia:'Đánh giá của khách sau khi nhận hàng, kèm trạng thái duyệt hiển thị.',DonHang:'Thông tin chung của đơn hàng.'};
for(const k in D)T[k].d=D[k];
T.SanPham.sub=r=>L('ThuongHieu',r.MaThuongHieu);T.KhachHang.sub=r=>r.Email||'';T.NhanVien.sub=r=>r.ChucVu||'';
T.TonKhoChiNhanh.head=['Sản phẩm & thương hiệu','Danh mục','Chi nhánh','Đơn giá','Tồn khả dụng','Giữ chỗ','Trạng thái'];
T.TonKhoChiNhanh.cells=r=>{const p=SP(r.MaSanPham),a=r.SoLuong-r.SoLuongGiuCho,k=kst(r);return [`<div class="nm">${esc(p.TenSanPham)}<small>${esc(L('ThuongHieu',p.MaThuongHieu))}</small></div>`,`<span class="cat">${esc(L('DanhMuc',p.MaDanhMuc))}</span>`,'📍 '+esc(L('ChiNhanh',r.MaChiNhanh)),`<b>${vnd(p.GiaKhuyenMai||p.GiaBan)}</b>`,`<b>${a}</b><div class="pb"><i style="width:${Math.min(100,a)}%"></i></div>`,`<span class="tag wn">${r.SoLuongGiuCho}</span>`,`<span class="tag ${k=='con'?'ok':k=='sap'?'wn':'bad'}">${{con:'Còn hàng',sap:'Sắp hết',het:'Hết hàng'}[k]}</span>`]};
T.TonKhoChiNhanh.vf=[{k:'cn',l:'Tất cả chi nhánh',o:()=>DB.ChiNhanh.map(c=>[c.MaChiNhanh,c.TenChiNhanh]),t:(r,v)=>r.MaChiNhanh==v},{k:'dm',l:'Tất cả danh mục',o:()=>DB.DanhMuc.map(d=>[d.MaDanhMuc,d.TenDanhMuc]),t:(r,v)=>SP(r.MaSanPham).MaDanhMuc==v},{k:'tt',l:'Mọi trạng thái kho',o:()=>[['con','Còn hàng'],['sap','Sắp hết'],['het','Hết hàng']],t:(r,v)=>kst(r)==v}];
document.addEventListener('keydown',e=>{if(e.key=='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#gs').focus()}});
render();
</script>
</body>
